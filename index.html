<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On-The-Go Physics</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    .part { margin-top: 32px; }
    .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .topic { display: flex; align-items: center; gap: 12px; padding: 12px 16px; text-decoration: none; color: inherit; }
    .topic .num { font-family: var(--mono); color: var(--ink-soft); width: 2ch; text-align: right; }
    .topic .title { flex: 1; }
    .topic .tag { font-size: .75rem; color: var(--ink-soft); }
    .topic[aria-disabled="true"] { opacity: .55; pointer-events: none; }
    a.topic:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">WAEC SSCE Physics</p>
    <h1>On-The-Go Physics</h1>
    <p class="muted">Lesson notes and hands-on experiences for every topic in the syllabus.</p>
    <div id="parts"></div>
  </main>

  <script src="shared/topics.js"></script>
  <script>
    const root = document.getElementById("parts");
    for (const [p, name] of Object.entries(PARTS)) {
      const sec = document.createElement("section");
      sec.className = "part";
      sec.innerHTML = `<p class="eyebrow">Part ${p}</p><h2>${name}</h2><ul class="list"></ul>`;
      const ul = sec.querySelector("ul");
      for (const t of TOPICS.filter(t => t.part === +p)) {
        const live = t.status === "live";
        ul.insertAdjacentHTML("beforeend", `
          <li><a class="card topic" href="topics/${String(t.n).padStart(2, "0")}-${t.slug}/"
                 ${live ? "" : 'aria-disabled="true"'}>
            <span class="num">${t.n}</span>
            <span class="title">${t.title}</span>
            <span class="tag">${live ? "" : "Coming soon"}</span>
          </a></li>`);
      }
      root.appendChild(sec);
    }
  </script>
</body>
</html>
